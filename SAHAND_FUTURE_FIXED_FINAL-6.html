const chat=document.getElementById('chat'),chatForm=document.getElementById('chatForm'),messageInput=document.getElementById('message'),sendBtn=document.getElementById('sendBtn');let aiReplies=0,chatLocked=false;chatForm.addEventListener('submit',e=>{e.preventDefault();if(chatLocked)return;let t=messageInput.value.trim();if(!t)return;chat.insertAdjacentHTML('beforeend','<div class="msg user">'+esc(t)+'</div>');aiReplies++;let reply=aiReplies===1?'سلام':aiReplies===2?'چخبرا':aiReplies===3?'شرمنده فعلا نمیشه':'';if(reply)chat.insertAdjacentHTML('beforeend','<div class="msg bot">'+reply+'</div>');messageInput.value='';if(aiReplies>=3){chatLocked=true;messageInput.disabled=true;sendBtn.disabled=true;messageInput.placeholder='چت قفل شد';sendBtn.style.opacity='.45';messageInput.style.opacity='.45'}chat.scrollTop=chat.scrollHeight});</script><script>function openPorsejoo(){document.getElementById('porsejooOverlay').style.display='flex'}function closePorsejoo(){document.getElementById('porsejooOverlay').style.display='none'}function selectPorsejoo(n,el){document.querySelectorAll('.porsejoo-options button').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('.porsejoo-options button').forEach(b=>{if(b.textContent==='10')b.classList.add('selected')})}</script>
<script>
const music=document.getElementById('bgMusic');
const musicPopup=document.getElementById('musicPopup');
const musicToggle=document.getElementById('musicToggle');
const yesMusic=document.getElementById('yesMusic');

function showMusicError(){
  alert('آهنگ از لینک فعلی قابل پخش نیست. لینک فایل آهنگ مشکل دارد.');
}

yesMusic.addEventListener('click', async function(){
  try{
    music.load();
    await music.play();
    musicPopup.style.display='none';
    musicToggle.textContent='⏸ توقف آهنگ';
  }catch(err){
    showMusicError();
  }
});

musicToggle.addEventListener('click', async function(){
  try{
    if(music.paused){
      await music.play();
      musicToggle.textContent='⏸ توقف آهنگ';
    }else{
      music.pause();
      musicToggle.textContent='▶️ پخش آهنگ';
    }
  }catch(err){
    showMusicError();
  }
});

music.addEventListener('error', showMusicError, {once:true});
setTimeout(()=>{document.getElementById('popup2').style.display='flex'},5000);
function closePopup(){document.getElementById('popup2').style.display='none'}
function stay(){}
function openPhotos(){document.getElementById('photoOverlay').style.display='flex'}
function closePhotos(){document.getElementById('photoOverlay').style.display='none'}
